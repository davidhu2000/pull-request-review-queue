<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pull Request Review Queue</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Review queue</strong>
      <a href="options.html" id="options">Options</a>
    </header>
    <p id="meta" class="meta">
      <span id="meta-text"></span>
      <button
        type="button"
        id="refresh"
        class="icon-btn"
        title="Check queue now"
        aria-label="Check queue now"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      </button>
    </p>
    <div id="loading">
      <span class="spinner-lg" aria-hidden="true"></span>
      <span>Loading queue…</span>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="empty">No pull requests waiting on you. Nice.</p>
    <p id="error" class="error"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
